on:
  pull_request:
    branches:
      - main

name: Autodoc

# The default token is read-only; the job below opts in to what it needs.
permissions: {}

jobs:
  autodoc:
    name: Update workflow documentation
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and cannot be pushed to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      # The script that runs is always taken from the base branch. The pull
      # request head is only ever read as data (workflow.yaml and README.md)
      # and committed to, never executed.
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: head
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Update documentation
        working-directory: head
        run: |
          python -m pip install pyyaml==6.0.3
          python ../base/.github/scripts/autodoc.py .github/workflows/workflow.yaml README.md

          # Exit early if no changes were made
          if [[ -z "$(git status --porcelain README.md)" ]]
          then
            echo "Nothing to do!"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git -c core.hooksPath=/dev/null commit -m "docs: update readme with autodoc"
          git -c core.hooksPath=/dev/null push
