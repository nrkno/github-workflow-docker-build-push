name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# These jobs never push: `push: false`, no registry credentials, and the reusable
# workflow additionally refuses to push on pull_request events.
jobs:
  image-ok:
    uses: ./.github/workflows/workflow.yaml
    with:
      runs-on: "['ubuntu-24.04']"
      registry-url: cr.example.com
      name: test
      context: ./test/image-ok
      push: false
    secrets:
      registry-username: ""
      registry-password: ""
      token: ${{ secrets.GITHUB_TOKEN }}

  image-vulnerable:
    uses: ./.github/workflows/workflow.yaml
    with:
      runs-on: "['ubuntu-24.04']"
      registry-url: cr.example.com
      name: test
      context: ./test/image-vulnerable
      push: false
      trivy-error-is-success: true
    secrets:
      registry-username: ""
      registry-password: ""
      token: ${{ secrets.GITHUB_TOKEN }}

  image-with-extra-tags:
    uses: ./.github/workflows/workflow.yaml
    with:
      runs-on: "['ubuntu-24.04']"
      registry-url: cr.example.com
      name: test
      context: ./test/image-ok
      push: false
      tag-extra: foo,bar,baz
    secrets:
      registry-username: ""
      registry-password: ""
      token: ${{ secrets.GITHUB_TOKEN }}
