on:
  workflow_call:
    inputs:
      cache:
        type: boolean
        default: true
        description: Whether to enable image layer cache.
      cache-tag:
        type: string
        default: buildcache
        description: Image tag to use for image layer cache.
      context:
        type: string
        default: "."
        description: The root directory for the Docker build context.
      dockerfile:
        type: string
        default: Dockerfile
        description: Path to a Dockerfile relative to the Docker build context path.
      git-ref:
        type: string
        default: ""
        description: The branch, tag or SHA to checkout. Leave empty for the current branch ref.
      git-submodules:
        type: boolean
        default: false
        description: Whether to also checkout Git submodules.
      push:
        type: boolean
        default: true
        description: Push a successfully built image to a registry.
      name:
        type: string
        description: Image name (repository path) within a registry.
        required: true
      ssh-agent:
        type: boolean
        default: false
        description: Whether to start an SSH agent for the build.
      tag-branch:
        type: boolean
        default: false
        description: Tag a successfully built image with the branch name.
      tag-sha:
        type: boolean
        default: true
        description: Tag a successfully built image with the commit SHA that triggered the workflow.
      tag-pr:
        type: boolean
        default: true
        description: Tag a successfully built image with reference to a Pull Request, e.g. pr-2.
      tag-latest:
        type: boolean
        default: false
        description: Tag a successfully built image with the tag latest.
      tag-extra:
        type: string
        default: ""
        description: Comma-separated list of additional image tags.
      registry-url:
        type: string
        description: URL to the container registry.
        required: true
      runs-on:
        type: string
        default: "['self-hosted']"
        description: Type of runner for the jobs. For non-self-hosted runners, use ubuntu-latest for example.
      trivy-enabled:
        type: boolean
        default: true
        description: Scan the built image for known vulnerabilities using Trivy.
      trivy-error-is-success:
        type: boolean
        default: false
        description: Do not produce an error if the Trivy scan fails. Primarily used for testing.
      trivy-ignore-unfixed:
        type: boolean
        default: true
        description: Ignore errors that do not have a known fix.
      trivy-ignore-files:
        type: string
        default: ""
        description: Comma-separated list of paths to Trivy ignore files, relative to the repository root.
      trivy-severity:
        type: string
        default: MEDIUM,HIGH,CRITICAL
        description: Comma-separated list of severities to consider an error.
      trivy-summary-enabled:
        type: boolean
        default: false
        description: Render a table of all the Trivy findings in the GitHub summary for the workflow.
      trivy-sbom-enabled:
        type: boolean
        default: false
        description: Generate an SBOM of your dependencies and submit them to GitHub Dependency Graph.
      build-args:
        type: string
        default: ""
        description: Newline separated list of build arguments to pass to the Docker build.
      secrets:
        type: string
        default: ""
        description: "secrets to use inside docker-build separated by newlines. ref: https://docs.docker.com/build/ci/github-actions/secrets/"
    secrets:
      git-ssh-key:
        description: SSH key used by Git to checkout the repository.
        required: false
      registry-username:
        description: Username for the container registry.
        required: true
      registry-password:
        description: Password for the container registry.
        required: true
      token:
        description: GitHub auth token.
        required: true
      ssh-deploy-key:
        description: SSH key to load in the SSH agent
        required: false
      npm-token:
        description: NPM authentication token for private packages. Exposed to the build only as BuildKit secrets `npmrc` and `npm_token`, never as a build-arg.
        required: false
    outputs:
      image-digest:
        description: The image digest for this build.
        value: ${{ jobs.build.outputs.image-digest }}
      image-ref:
        description: An image reference for this build (`<name>:<git-sha>@<digest>`).
        value: ${{ jobs.build.outputs.image-ref }}
      image-ref-stripped:
        description: An image reference for this build, stripped of its registry URL (`<name>:<git-sha>@<digest>`).
        value: ${{ jobs.build.outputs.image-ref-stripped }}
      image-tags:
        description: Comma-separated list of generated image tags for this build, (`<registry-url>/<name1>:<tag1>,<registry-url>/<name1>:<tag2>`).
        value: ${{ jobs.build.outputs.image-tags }}
      image-tags-stripped:
        description: Comma-separated list of generated image tags for this build, stripped of their registry URL, without a leading slash (`<name1>:<tag1>,<name1>:<tag2>`).
        value: ${{ jobs.build.outputs.image-tags-stripped }}
      unique-id:
        description: A generated unique ID for this run. Can be useful when debugging runners to determine artifact filenames.
        value: ${{ jobs.build.outputs.unique-id }}

# No top-level `permissions:` on purpose. A called workflow can only keep or
# reduce the caller's GITHUB_TOKEN permissions, and requesting a permission the
# caller does not grant (e.g. `contents: read` for a caller with only
# `packages: write`) stops the run from starting. This workflow does not need
# its own token: checkout, registry and npm access use the secrets passed by
# the caller. Callers should set `permissions: contents: read` on the calling job.

jobs:
  build:
    name: Build and push
    runs-on: ${{ fromJson(inputs.runs-on) }}
    steps:
      #
      # Build
      #

      - # A unique ID used to name artifacts produced.
        # At least on self-hosted runners, we seem to share the workspace directory
        # leading to race conditions if multiple instances of this workflow are
        # running in parallel within the same run.
        #
        # All caller-controlled values and secrets reach scripts through `env:`,
        # never by interpolating `${{ }}` into the script text.
        name: Set environment
        id: setup
        env:
          GIT_SHA: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ secrets.registry-username }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "unique-id=$(date +%Y-%m-%d)-${GIT_SHA}-$(openssl rand -hex 20)" >> "$GITHUB_OUTPUT"
          # Pull requests build (and scan) to test compatibility, but must never
          # publish anything, whatever the caller passed in `push`. The event is
          # the caller's, so this cannot be overridden by an input.
          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "pull_request_target" ]]
          then
            echo "is-pr=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request event: the image is built but never pushed or submitted."
          fi
          if [[ "${REGISTRY_USERNAME}" != "" ]]
          then
            echo "docker_login=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}
          token: ${{ secrets.token }}
          submodules: ${{ inputs.git-submodules }}
          ssh-key: ${{ secrets.git-ssh-key }}
          # Keep the token and SSH key out of .git/config, which would otherwise
          # be part of the build context.
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.setup.outputs.docker_login == 'yes'
        name: Docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry-url }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}
      - if: ${{ inputs.ssh-agent }}
        name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ssh-deploy-key }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          push: false
          pull: true
          tags: ${{ inputs.name }}:${{ steps.setup.outputs.unique-id }}
          build-args: ${{ inputs.build-args }}
          # The npm token is exposed to RUN steps only as BuildKit secrets, never
          # as a build-arg (build-args are recorded in image history):
          #   npmrc     - a ready-made .npmrc line for registry.npmjs.org
          #   npm_token - the bare token
          # Empty lines are ignored by the action.
          secrets: |
            ${{ inputs.secrets }}
            ${{ secrets.npm-token && format('npmrc=//registry.npmjs.org/:_authToken={0}', secrets.npm-token) || '' }}
            ${{ secrets.npm-token && format('npm_token={0}', secrets.npm-token) || '' }}
          outputs: type=docker
          cache-from: ${{ inputs.cache && format('type=registry,ref={0}/{1}:{2}', inputs.registry-url, inputs.name, inputs.cache-tag) || '' }}
          # Only the default branch may write the shared layer cache, so that
          # branch and PR builds cannot seed layers that later releases reuse.
          # Scheduled runs always execute on the default branch, and their event
          # payload has no `repository.default_branch`. `pull_request_target`
          # runs with the base branch as `github.ref`, so it is excluded by event.
          cache-to: ${{ inputs.cache && steps.setup.outputs.is-pr != 'yes' && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && format('type=registry,ref={0}/{1}:{2},mode=max,ignore-error=true', inputs.registry-url, inputs.name, inputs.cache-tag) || '' }}
          ssh: ${{ inputs.ssh-agent && format('default={0}', env.SSH_AUTH_SOCK) || '' }}

      #
      # Vulnerability scan
      #
      # Uses aquasecurity/trivy-action pinned by commit SHA to the immutable
      # v0.36.0 release (published 2026-04-22, after the GHSA-69fq-xp46-6x23
      # tag hijack of 2026-03-19/20). That release pins aquasecurity/setup-trivy
      # to v0.2.6 by SHA and defaults to Trivy v0.70.0, which is outside the
      # compromised Trivy releases (v0.69.4 - v0.69.6). Do not bump to a tag
      # without re-pinning by SHA.
      #

      - if: inputs.trivy-enabled
        name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - if: inputs.trivy-enabled && inputs.trivy-summary-enabled
        name: Scan for vulnerabilities (table format)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          exit-code: "0"
          hide-progress: false
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          image-ref: ${{ inputs.name }}:${{ steps.setup.outputs.unique-id }}
          output: ${{ steps.setup.outputs.unique-id }}-trivy-scan-result.txt
          scanners: vuln,config
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          trivyignores: ${{ inputs.trivy-ignore-files }}
          vuln-type: os,library
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
      - if: inputs.trivy-enabled && inputs.trivy-summary-enabled
        name: Post all scan results to Github Summary as a table
        env:
          CODE_BLOCK: "```"
          RESULT_FILENAME: ${{ steps.setup.outputs.unique-id }}-trivy-scan-result.txt
        run: |
          echo "# Trivy scan results" >> "$GITHUB_STEP_SUMMARY"

          echo "$CODE_BLOCK" >> "$GITHUB_STEP_SUMMARY"
          cat "$RESULT_FILENAME" >> "$GITHUB_STEP_SUMMARY"
          echo "$CODE_BLOCK" >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.trivy-enabled && inputs.trivy-sbom-enabled && steps.setup.outputs.is-pr != 'yes'
        name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          format: github
          hide-progress: false
          output: "dependency-results.sbom.json"
          image-ref: ${{ inputs.name }}:${{ steps.setup.outputs.unique-id }}
          # The caller's `token` secret is used so that this reusable workflow
          # needs no write permission of its own. Dependency submission needs a
          # token that can write to the caller's repository.
          github-pat: ${{ secrets.token }}
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
      - if: inputs.trivy-enabled
        name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          exit-code: "0"
          format: json
          hide-progress: false
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          image-ref: ${{ inputs.name }}:${{ steps.setup.outputs.unique-id }}
          output: ${{ steps.setup.outputs.unique-id }}-trivy-scan-result.json
          scanners: vuln,config
          severity: ${{ inputs.trivy-severity }}
          trivyignores: ${{ inputs.trivy-ignore-files }}
          vuln-type: os,library
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
      - if: inputs.trivy-enabled
        name: Parse vulnerability scan results
        continue-on-error: ${{ inputs.trivy-error-is-success }}
        shell: python
        env:
          RESULT_FILENAME: ${{ steps.setup.outputs.unique-id }}-trivy-scan-result.json
        id: parse
        run: |
          import json
          import os
          import sys

          def escape(s):
              # Scan results contain third-party text; stop it from forging
              # workflow commands.
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          with open(os.environ["RESULT_FILENAME"], "r") as f:
              data = json.load(f)

          exit_code = 0
          for result in data.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  # Severity to report to GitHub
                  sev = "error" if vuln.get("Severity") in ("HIGH", "CRITICAL") else "warning"
                  msg = f"{vuln.get('Severity')} {vuln.get('VulnerabilityID')} {vuln.get('PkgName')}: {vuln.get('Title')} ({vuln.get('PrimaryURL')})"
                  print(f"::{sev}::{escape(msg)}")

                  # Since severity filter is set at job level, we can exit non-zero for all
                  # issues regardless of severity and let workflow consumers decide which
                  # severity levels to care about.
                  exit_code = 2

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"exit-code={exit_code}", file=f)
          print("Raw results:")
          json.dump(data, sys.stdout)
          sys.exit(exit_code)
      - if: inputs.trivy-enabled && inputs.trivy-error-is-success
        name: Test results
        env:
          EXIT_CODE: ${{ steps.parse.outputs.exit-code }}
        run: |
          test "${EXIT_CODE}" = "2"

      #
      # Push
      #

      - name: Build list of additional tags
        id: additional-tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Passed through the environment so that the value is data, never code.
          TAG_EXTRA: ${{ inputs.tag-extra }}
        with:
          script: |
            core.setOutput('tags', (process.env.TAG_EXTRA || '').split(",").join("\n"))
      - name: Generate image tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            ${{ inputs.registry-url }}/${{ inputs.name }}
          tags: |
            type=ref,event=pr,enable=${{ inputs.tag-pr }}
            type=ref,event=branch,enable=${{ inputs.tag-branch }}
            type=raw,value=${{ github.sha }},enable=${{ inputs.tag-sha }}
            type=raw,value=latest,enable=${{ inputs.tag-latest }}
            ${{ steps.additional-tags.outputs.tags }}
      - if: inputs.push && steps.setup.outputs.is-pr != 'yes' && steps.setup.outputs.docker_login == 'yes'
        name: Push tags
        id: push
        env:
          IMAGE: ${{ inputs.name }}:${{ steps.setup.outputs.unique-id }}
          TAGS: ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          IMAGE_NAME: ${{ inputs.name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"

          digest=""
          tags=""
          tags_stripped=""
          for tag in $TAGS
          do
            docker tag "$IMAGE" "$tag"

            # Capture the image digest. Doesn't matter that it gets overwritten
            # every iteration, as they are all the same.
            digest=$(docker push "$tag" | tee | grep -oP 'digest: \K(sha256:[0-9a-f]*)')

            # Collect all tags, both stripped of the registry URL and not.
            tags+="${tag},"
            stripped=${tag#"${REGISTRY_URL}/"}
            tags_stripped+="${stripped},"

            # Add tag to summary output
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"

          # Remove trailing comma before setting as output var
          echo "image-tags=$(echo "$tags" | sed 's|,*$||')" >> "$GITHUB_OUTPUT"
          echo "image-tags-stripped=$(echo "$tags_stripped" | sed 's|,*$||')" >> "$GITHUB_OUTPUT"
          echo "image-digest=${digest}" >> "$GITHUB_OUTPUT"

          echo "### Digest" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          echo "### Image reference" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REGISTRY_URL}/${IMAGE_NAME}:${GIT_SHA}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
      image-ref: ${{ inputs.registry-url }}/${{ inputs.name }}:${{ github.sha }}@${{ steps.push.outputs.image-digest }}
      image-ref-stripped: ${{ inputs.name }}:${{ github.sha }}@${{ steps.push.outputs.image-digest }}
      image-tags: ${{ steps.push.outputs.image-tags }}
      image-tags-stripped: ${{ steps.push.outputs.image-tags-stripped }}
      unique-id: ${{ steps.setup.outputs.unique-id }}
